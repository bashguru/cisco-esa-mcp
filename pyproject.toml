[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-esa-mcp"
version = "0.1.0"
description = "Local, free, hybrid-search MCP server over product documentation (ParadeDB + FastMCP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.10",
    "docling>=2.15",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3.6",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cisco-mcp-serve = "cisco_mcp.server:main"
cisco-mcp-ingest = "cisco_mcp.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cisco_mcp = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
